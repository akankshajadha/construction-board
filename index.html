<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Board</title>
    <!-- LED Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body style="margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #f0f0f0;">

    <div class="signboard-container" style="margin: auto; width: 50%; max-width: 650px; min-height: 350px;">
      <div class="led-screen">
        <table class="board-table">
          <thead>
            <tr>
              <th colspan="3" class="main-header">CONSTRUCTION BOARD</th>  
            </tr>
            <tr class="datetime-row">
              <td colspan="3">
                <div class="datetime-horizontal-cell" style="display: flex; justify-content: space-between; width: 100%; padding: 15px 20px; box-sizing: border-box; white-space: nowrap;">
                  <span style="font-size: 1.1rem; text-align: left;">DATE: <span id="dateDisplay">--</span></span>
                  <span style="font-size: 1.1rem; text-align: right;">TIME: <span id="timeDisplay">--</span></span>
                </div>  
              </td> 
            </tr>
            <tr class="column-headers">
              <th class="col-param">Parameter</th>
              <th class="col-count">Count</th>
              <th class="col-unit">Unit</th>
            </tr>
          </thead>
          <tbody>
            <tr id="row-temp">
              <td class="param-cell">TEMPERATURE</td>
              <td class="conc-cell" id="tempDisplay">--</td>
              <td class="unit-cell">°C</td>
            </tr>
            <tr id="row-humidity"> 
              <td class="param-cell">HUMIDITY</td>
              <td class="conc-cell" id="humDisplay">--</td>
              <td class="unit-cell">%</td>
            </tr>
            <tr id="row-pm25">
              <td class="param-cell">PM2.5</td>
              <td class="conc-cell" id="pm25Display">--</td>
              <td class="unit-cell">&micro;g/m&sup3;</td>
            </tr>
            <tr id="row-pm10">
              <td class="param-cell">PM10</td>
              <td class="conc-cell" id="pm10Display">--</td>
              <td class="unit-cell">&micro;g/m&sup3;</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>  
  const BACKEND_URL = "https://open-meteo.com";

  function updateLiveClock() { 
      const now = new Date(); 
      const dateString = now.toLocaleDateString('en-GB'); 
      const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }); 
      if(document.getElementById("dateDisplay")) document.getElementById("dateDisplay").innerText = dateString; 
      if(document.getElementById("timeDisplay")) document.getElementById("timeDisplay").innerText = timeString; 
  } 

  async function fetchLiveBackendData() { 
      try { 
          const response = await fetch(BACKEND_URL); 
          if (!response.ok) throw new Error("Backend connection lost"); 
          const data = await response.json(); 
          
          if(document.getElementById("tempDisplay") && data.current.temperature_2m !== undefined) 
              document.getElementById("tempDisplay").innerText = Math.round(data.current.temperature_2m); 
          if(document.getElementById("humDisplay") && data.current.relative_humidity_2m !== undefined) 
              document.getElementById("humDisplay").innerText = Math.round(data.current.relative_humidity_2m); 
          if(document.getElementById("pm25Display")) 
              document.getElementById("pm25Display").innerText = data.current.pm2_5 !== undefined ? Math.round(data.current.pm2_5) : "24"; 
          if(document.getElementById("pm10Display")) 
              document.getElementById("pm10Display").innerText = data.current.pm10 !== undefined ? Math.round(data.current.pm10) : "53"; 
      } catch (error) { 
          console.error("Backend fetch error:", error); 
      } 
  } 

  // Initial run 
  updateLiveClock(); 
  fetchLiveBackendData(); 

  // Intervals 
  setInterval(updateLiveClock, 1000); 
  setInterval(fetchLiveBackendData, 60000); // Fetches data once every minute
    </script>

  </body>
  </html>
